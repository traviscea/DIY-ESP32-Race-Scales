ed" x1="290" x2="180" y1="510" y2="510" /><circle class="node-red" cx="180" cy="510" r="2.5" /><line class="wire-red" x1="290" x2="180" y1="560" y2="560" /><circle class="node-red" cx="180" cy="560" r="2.5" /><line class="wire-red" x1="290" x2="180" y1="610" y2="610" /><circle class="node-red" cx="180" cy="610" r="2.5" /><line class="wire-red" x1="180" x2="180" y1="510" y2="680" /><line class="wire-red" x1="180" x2="580" y1="680" y2="680" /><line class="wire-red" x1="580" x2="580" y1="680" y2="740" /><line class="wire-red" x1="950" x2="1060" y1="210" y2="210" /><circle class="node-red" cx="1060" cy="210" r="2.5" /><line class="wire-red" x1="950" x2="1060" y1="260" y2="260" /><circle class="node-red" cx="1060" cy="260" r="2.5" /><line class="wire-red" x1="950" x2="1060" y1="310" y2="310" /><circle class="node-red" cx="1060" cy="310" r="2.5" /><line class="wire-red" x1="1060" x2="1060" y1="210" y2="700" /><line class="wire-red" x1="1060" x2="660" y1="700" y2="700" /><line class="wire-red" x1="660" x2="660" y1="700" y2="740" /><line class="wire-red" x1="950" x2="1020" y1="510" y2="510" /><circle class="node-red" cx="1020" cy="510" r="2.5" /><line class="wire-red" x1="950" x2="1020" y1="560" y2="560" /><circle class="node-red" cx="1020" cy="560" r="2.5" /><line class="wire-red" x1="950" x2="1020" y1="610" y2="610" /><circle class="node-red" cx="1020" cy="610" r="2.5" /><line class="wire-red" x1="1020" x2="1020" y1="510" y2="680" /><line class="wire-red" x1="1020" x2="620" y1="680" y2="680" /><line class="wire-red" x1="620" x2="620" y1="680" y2="740" /><text class="text-small" fill="#e53e3e" transform="rotate(-90, 535, 730)" x="535" y="730">Group A red → E+</text><text class="text-small" fill="#e53e3e" transform="rotate(-90, 575, 730)" x="575" y="730">Group B red → A-</text><text class="text-small" fill="#e53e3e" transform="rotate(-90, 655, 730)" x="655" y="730">Group C red → A+</text><text class="text-small" fill="#e53e3e" transform="rotate(-90, 615, 730)" x="615" y="730">Group D red → E-</text><circle class="node-red" cx="540" cy="740" r="3" /><text class="text-small" text-anchor="middle" x="540" y="755">E+</text><circle class="node-red" cx="580" cy="740" r="3" /><text class="text-small" text-anchor="middle" x="580" y="755">A-</text><circle class="node-red" cx="620" cy="740" r="3" /><text class="text-small" text-anchor="middle" x="620" y="755">E-</text><circle class="node-red" cx="660" cy="740" r="3" /><text class="text-small" text-anchor="middle" x="660" y="755">A+</text><circle class="node" cx="540" cy="820" r="3" /><text class="text-small" text-anchor="middle" x="540" y="815">VCC</text><circle class="node" cx="580" cy="820" r="3" /><text class="text-small" text-anchor="middle" x="580" y="815">DT</text><circle class="node" cx="620" cy="820" r="3" /><text class="text-small" text-anchor="middle" x="620" y="815">SCK</text><circle class="node" cx="660" cy="820" r="3" /><text class="text-small" text-anchor="middle" x="660" y="815">GND</text><circle class="node" cx="540" cy="880" r="3" /><text class="text-small" text-anchor="middle" x="540" y="895">3.3V</text><circle class="node" cx="580" cy="880" r="3" /><text class="text-small" text-anchor="middle" x="580" y="895">GPIO4</text><circle class="node" cx="620" cy="880" r="3" /><text class="text-small" text-anchor="middle" x="620" y="895">GPIO5</text><circle class="node" cx="660" cy="880" r="3" /><text class="text-small" text-anchor="middle" x="660" y="895">GND</text><line class="wire-red" x1="540" x2="540" y1="820" y2="880" /><line class="wire-outline" x1="580" x2="580" y1="820" y2="880" /><line class="wire-yellow" x1="580" x2="580" y1="820" y2="880" /><line class="wire-outline" x1="620" x2="620" y1="820" y2="880" /><line class="wire-solid-white" x1="620" x2="620" y1="820" y2="880" /><line class="wire-black" x1="660" x2="660" y1="820" y2="880" /><rect class="box" height="60" width="100" x="780" y="900" /><text class="subtitle" text-anchor="middle" x="830" y="925">1S LiPo</text><text class="text" text-anchor="middle" x="830" y="945">1000mAh</text><circle class="node" cx="680" cy="920" r="3" /><circle class="node" cx="680" cy="940" r="3" /><text class="text-small" text-anchor="end" x="670" y="924">JST +</text><text class="text-small" text-anchor="end" x="670" y="944">JST -</text><line class="wire-red" stroke-width="3" x1="780" x2="680" y1="920" y2="920" /><line class="wire-black" stroke-width="3" x1="780" x2="680" y1="940" y2="940" /><circle class="node-red" cx="780" cy="920" r="3" /><circle class="node" cx="780" cy="940" r="3" /><text class="text" fill="#e53e3e" font-weight="bold" text-anchor="end" x="770" y="925">+</text><text class="text" font-weight="bold" text-anchor="end" x="770" y="945">-</text><rect class="box" height="160" width="480" x="40" y="1040" /><text class="subtitle" x="55" y="1065">WIRING INSTRUCTIONS &amp; LEGEND</text><text class="info-text" font-weight="bold" x="55" y="1090">1. Wheatstone Bridges (Layer 1, 2, 3)</text><text class="info-text" x="55" y="1110"> - Solid line (Black): A↔C and B↔D horizontally</text><text class="info-text" x="55" y="1130"> - Dashed line (White): A↔B and C↔D vertically</text><text class="info-text" fill="#c05621" font-weight="bold" x="55" y="1150"> - ONLY connect SAME layers (e.g. A1 to C1)</text><text class="info-text" font-weight="bold" x="55" y="1170">2. HX711 Connections</text><text class="info-text" x="55" y="1190"> - All Red wires group by plate corner to HX711</text><rect class="box" height="160" width="280" x="540" y="1040" /><text class="subtitle" x="555" y="1065">HX711 ↔ ESP32 WIRING KEY</text><circle cx="560" cy="1095" fill="#e53e3e" r="5" /><text class="text" x="575" y="1100">RED    - VCC ↔ 3.3V</text><circle cx="560" cy="1125" fill="#ecc94b" r="5" stroke="#4a5568" stroke-width="1.5" /><text class="text" x="575" y="1130">YELLOW - DT ↔ GPIO4</text><circle cx="560" cy="1155" fill="#ffffff" r="5" stroke="#4a5568" stroke-width="1.5" /><text class="text" x="575" y="1160">WHITE  - SCK ↔ GPIO5</text><circle cx="560" cy="1185" fill="#000000" r="5" /><text class="text" x="575" y="1190">BLACK  - GND ↔ GND</text><rect class="warning-box" height="160" width="320" x="840" y="1040" /><text class="warning-text" font-size="18px" x="855" y="1065">WARNING!</text><text class="warning-text" x="855" y="1090">Check JST Battery Polarity!</text><text class="info-text" x="855" y="1125">Connect 1S LiPo to ESP32</text><text class="info-text" font-weight="bold" x="855" y="1145">JST connector ONLY.</text><text class="info-text" x="855" y="1175">Do NOT connect LiPo to HX711</text><text class="info-text" x="855" y="1195">or load cell sensors directly.</text></svg>